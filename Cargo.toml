[package]
name = "vsheet"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust CLI to generate clean, multi-theme same-name video contact sheets"
license = "MIT"
repository = "https://github.com/zjy-dev/vsheet"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
indicatif = "0.17"
rayon = "1.10"
resvg = "0.44"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
